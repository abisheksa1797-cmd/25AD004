<!DOCTYPE html>
<html>
<head>
    <title>CampusFind - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .box {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e3a8a;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            color: #1e3a8a;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>CampusFind</h1>
    <h2>Login</h2>

    <form>

        <label>Email</label>
        <input type="email" placeholder="Enter email" required>

        <label>Password</label>
        <input type="password" placeholder="Enter password" required>

        <button type="submit">Login</button>

    </form>

    <p>Don't have an account?</p>

    <a href="register.html">Create Account</a>

    <br><br>

    <a href="index.html">Back to Home</a>

</div>

</body>
</html>
