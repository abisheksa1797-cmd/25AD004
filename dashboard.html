<!DOCTYPE html>
<html>
<head>
  <title>CampusFind - Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      text-align: center;
      margin-top: 40px;
    }

    .card {
      background: white;
      display: inline-block;
      width: 220px;
      padding: 25px;
      margin: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ccc;
    }

    button {
      padding: 10px 20px;
      background: #1e3a8a;
      color: white;
      border: none;
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>CampusFind Dashboard</h1>
  <p>Welcome to CampusFind</p>
</header>

<div class="container">

  <div class="card">
    <h2>Lost Item</h2>
    <p>Report an item you lost.</p>
    <button>
      <a href="report-lost.html">Report Lost</a>
    </button>
  </div>

  <div class="card">
    <h2>Found Item</h2>
    <p>Report an item you found.</p>
    <button>
      <a href="report-found.html">Report Found</a>
    </button>
  </div>

  <div class="card">
    <h2>Search</h2>
    <p>Search for items.</p>
    <button>
      <a href="search.html">Search</a>
    </button>
  </div>

</div>

</body>
</html>
