<!DOCTYPE html>
<html>
<head>
    <title>CampusFind - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            text-align: center;
            margin-top: 50px;
        }

        .card {
            background: white;
            width: 250px;
            display: inline-block;
            margin: 15px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>CampusFind</h1>
    <p>Lost and Found Item Tracker</p>
</header>

<div class="container">

    <div class="card">
        <h2>Login</h2>
        <p>Login to your account.</p>
        <button>
            <a href="login.html">Login</a>
        </button>
    </div>

    <div class="card">
        <h2>Register</h2>
        <p>Create a new account.</p>
        <button>
            <a href="register.html">Register</a>
        </button>
    </div>

    <div class="card">
        <h2>Search Items</h2>
        <p>Find lost and found items.</p>
        <button>
            <a href="search.html">Search</a>
        </button>
    </div>

</div>

</body>
</html>
