<!DOCTYPE html>
<html>
<head>
  <title>Admin - CampusFind</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      width: 80%;
      margin: 40px auto;
      text-align: center;
    }

    .card {
      background: white;
      display: inline-block;
      width: 200px;
      margin: 15px;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ccc;
    }

    button {
      padding: 10px 20px;
      background: #111827;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>CampusFind Admin Panel</h1>
  <p>Manage Lost and Found Items</p>
</header>

<div class="container">

  <div class="card">
    <h2>Users</h2>
    <h3>25</h3>
    <button>View Users</button>
  </div>

  <div class="card">
    <h2>Lost Items</h2>
    <h3>12</h3>
    <button>View Items</button>
  </div>

  <div class="card">
    <h2>Found Items</h2>
    <h3>18</h3>
    <button>View Items</button>
  </div>

  <div class="card">
    <h2>Reports</h2>
    <h3>5</h3>
    <button>View Reports</button>
  </div>

</div>

</body>
</html>
